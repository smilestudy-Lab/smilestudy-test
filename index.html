<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>スマイルスタディ 講師研修テスト</title>
    <link rel="icon" href="assets/images/logo-mark.jpg" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/screens.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="site-header">
      <img class="site-header__logo" data-image="logoLockup" alt="1対1 スマイルスタディ" />
    </header>

    <main class="container">
      <!-- スタート画面 -->
      <section id="screen-start" class="screen" hidden>
        <div class="card hero">
          <img class="character-full" data-image="characterFull" alt="スマるん" />
          <h1 class="hero__title">講師研修テスト</h1>
          <p class="hero__speech">研修ナビゲーターのスマるんです。<br />最後の確認テスト、がんばろう！</p>
          <p class="hero__lead">研修資料と研修動画の内容から出題します。<br />満点がとれるまで、何度でも挑戦しよう！</p>
          <ul class="rules">
            <li>問題数：<strong data-text="questionCount"></strong>問</li>
            <li>制限時間：<strong data-text="timeLimit"></strong></li>
            <li>時間切れになると、その時点の回答で採点します</li>
            <li>結果は ○ × だけ表示されます（記録は残りません）</li>
          </ul>
          <button type="button" class="button button--primary" data-action="start">テストをはじめる</button>
        </div>
      </section>

      <!-- 出題画面 -->
      <section id="screen-quiz" class="screen" hidden>
        <div class="quiz-bar">
          <div class="quiz-bar__progress">回答 <span data-role="answered">0</span> / <span data-role="total">0</span></div>
          <div class="quiz-bar__timer" data-role="timer" aria-live="polite">10:00</div>
        </div>
        <ol class="question-list" data-role="questions"></ol>
        <div class="quiz-footer">
          <p class="quiz-footer__note" data-role="unanswered-note"></p>
          <button type="button" class="button button--primary" data-action="submit">採点する</button>
        </div>
      </section>

      <!-- 結果画面 -->
      <section id="screen-result" class="screen" hidden>
        <div class="card result-summary">
          <img class="character-face" data-image="characterFace" alt="スマるん" />
          <p class="result-summary__label" data-role="headline"></p>
          <p class="result-summary__score"><span data-role="score">0</span> / <span data-role="total">0</span></p>
          <p class="result-summary__message" data-role="message"></p>
          <button type="button" class="button button--primary" data-action="retry">もう一度挑戦する</button>
        </div>
        <ol class="result-list" data-role="results"></ol>
      </section>
    </main>
  </body>
</html>
